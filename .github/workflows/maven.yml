name: Java CI

on:
  push:
  pull_request:
  schedule: [ cron: '48 12 * * 5' ]

jobs:
  build:
    strategy:
      matrix:
        jdk: [ 17, 21, 25 ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdk }}
          cache: 'maven'

      # pomx extension is not published to Maven Central;
      # pom.xml is pre-generated and sufficient for building
      # cheap disable of pomx
      - run: rm .mvn/extensions.xml

      - run: mvn --batch-mode --show-version --no-transfer-progress -DCI=GitHub install
